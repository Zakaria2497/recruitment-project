version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: seasonal_db
    environment:
      POSTGRES_DB: seasonal_app_db
      POSTGRES_USER: seasonal_user
      POSTGRES_PASSWORD: seasonal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seasonal_user -d seasonal_app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./seasonal_app
      dockerfile: Dockerfile
    container_name: seasonal_backend
    command: >
      sh -c "python3.12 manage.py migrate &&
             python3.12 manage.py collectstatic --noinput &&
             gunicorn seasonal_app.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./seasonal_app:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-docker-dev-key-change-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DB_NAME=seasonal_app_db
      - DB_USER=seasonal_user
      - DB_PASSWORD=seasonal_password
      - DB_HOST=db
      - DB_PORT=5432
      - JWT_ACCESS_TOKEN_LIFETIME=60
      - JWT_REFRESH_TOKEN_LIFETIME=1440
    depends_on:
      db:
        condition: service_healthy

  # Vite Frontend
  frontend:
    build:
      context: ./seasonal_app_frontend
      dockerfile: Dockerfile
    container_name: seasonal_frontend
    volumes:
      - ./seasonal_app_frontend:/app
      - /app/node_modules
    ports:
      - "5173:3001"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  static_volume:
  media_volume:
